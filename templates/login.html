<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RetailAI | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f8f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 900px;
            min-height: 550px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        }

        /* LEFT SIDE */

        .left {
            width: 45%;
            background: linear-gradient(145deg, #09251e, #164d3c);
            color: white;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 50px;
        }

        .logo span {
            color: #71e6a8;
        }

        .left h1 {
            font-size: 38px;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .left h1 span {
            color: #71e6a8;
        }

        .left p {
            color: #c9ddd5;
            line-height: 1.6;
            font-size: 15px;
        }

        .quote {
            margin-top: 35px;
            font-style: italic;
            color: #71e6a8 !important;
        }

        /* RIGHT SIDE */

        .right {
            width: 55%;
            padding: 55px 60px;
        }

        .right h2 {
            font-size: 30px;
            color: #10231d;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab {
            border: none;
            background: #eef4f1;
            padding: 11px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab.active {
            background: #102f26;
            color: white;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #45c88a;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #65dda0;
            color: #09251e;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #4dce8e;
        }

        .message {
            background: #fff1f1;
            color: #d33;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        @media(max-width: 750px) {

            .login-container {
                width: 95%;
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 35px;
            }

            .left .logo {
                margin-bottom: 25px;
            }

            .right {
                padding: 35px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- LEFT -->

    <div class="left">

        <div class="logo">
            Retail<span>AI</span>
        </div>

        <h1>
            Smart Shopping.<br>
            <span>Made Simple.</span>
        </h1>

        <p>
            Shop fresh products from your local store
            with smart recommendations powered by AI.
        </p>

        <p class="quote">
            “Smart Shopping. Fresh Choices. Better Living.”
        </p>

    </div>


    <!-- RIGHT -->

    <div class="right">

        <h2 id="title">Welcome Back 👋</h2>

        <p class="subtitle" id="subtitle">
            Login to continue shopping
        </p>


        <!-- TABS -->

        <div class="tabs">

            <button class="tab active"
                    onclick="showLogin()"
                    id="loginTab">
                Login
            </button>

            <button class="tab"
                    onclick="showSignup()"
                    id="signupTab">
                Sign Up
            </button>

        </div>


        <!-- MESSAGE -->

        {% if message %}
        <div class="message">
            {{ message }}
        </div>
        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST" id="loginForm">

            <input type="hidden"
                   name="action"
                   value="login">

            <div class="form-group">

                <label>Email</label>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>


            <button class="submit-btn"
                    type="submit">

                Login to RetailAI →

            </button>

        </form>


        <!-- SIGN UP FORM -->

        <form method="POST"
              id="signupForm"
              style="display:none;">

            <input type="hidden"
                   name="action"
                   value="signup">


            <div class="form-group">

                <label>Name</label>

                <input type="text"
                       name="name"
                       placeholder="Enter your name"
                       required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Create a password"
                       required>

            </div>


            <button class="submit-btn"
                    type="submit">

                Create Account →

            </button>

        </form>


        <a href="/" class="back">
            ← Back to Shopping
        </a>

    </div>

</div>


<script>

function showLogin() {

    document.getElementById("loginForm").style.display = "block";
    document.getElementById("signupForm").style.display = "none";

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");

    document.getElementById("title").innerText =
        "Welcome Back 👋";

    document.getElementById("subtitle").innerText =
        "Login to continue shopping";
}


function showSignup() {

    document.getElementById("loginForm").style.display = "none";
    document.getElementById("signupForm").style.display = "block";

    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("signupTab").classList.add("active");

    document.getElementById("title").innerText =
        "Create Account ✨";

    document.getElementById("subtitle").innerText =
        "Join RetailAI and start shopping";
}

</script>

</body>
</html>
